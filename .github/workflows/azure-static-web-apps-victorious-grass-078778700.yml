name: Azure Static Web Apps CI/CD - TEST

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue frontend
        run: npm --prefix app run build -- --mode test

      - name: Package Azure Functions API
        run: |
          npm run api:package
          npm ci --prefix .swa-api --omit=dev

      - name: Verify frontend build
        run: |
          if [ ! -f public/app/index.html ] || [ ! -f public/app/staticwebapp.config.json ]; then
            echo "❌ Frontend build failed - index.html not found"
            exit 1
          fi
          echo "✅ Frontend build successful"

      - name: Validate environment variables (test)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING_TEST }}
        run: |
          echo "🔍 Validating test environment..."
          if [ -z "$DB_CONNECTION_STRING" ]; then
            echo "❌ ERROR: DB_CONNECTION_STRING_TEST not set in GitHub secrets"
            exit 1
          fi
          
          node scripts/validate-db-target.js shriyaminingdbtest

      - name: Run database migrations (test)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING_TEST }}
        run: |
          echo "🗄️  Running migrations on test database..."
          if npm run migrate; then
            echo "✅ Migrations succeeded"
          else
            echo "❌ Migrations failed"
            exit 1
          fi

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_GRASS_078778700 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "public/app"
          api_location: ".swa-api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Run post-deploy smoke tests (test)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          VITE_API_BASE_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: node scripts/smoke-test.js

      - name: Log deployment info
        if: success()
        run: |
          echo "✅ Test SWA deployment succeeded!"
          echo "Frontend: public/app"
          echo "API: api/"
          echo "Database: shriyaminingdbtest"
          echo "Status: Check Azure Portal for details"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_GRASS_078778700 }}
          action: "close"
