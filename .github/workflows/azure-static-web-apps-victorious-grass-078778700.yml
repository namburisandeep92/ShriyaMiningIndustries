name: Azure Static Web Apps CI/CD - TEST

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue frontend
        run: npm run app:build

      - name: Verify frontend build
        run: |
          if [ ! -f public/app/index.html ]; then
            echo "❌ Frontend build failed - index.html not found"
            exit 1
          fi
          echo "✅ Frontend build successful"

      - name: Validate environment variables (test)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING_TEST }}
        run: |
          echo "🔍 Validating test environment..."
          if [ -z "$DB_CONNECTION_STRING" ]; then
            echo "❌ ERROR: DB_CONNECTION_STRING_TEST not set in GitHub secrets"
            exit 1
          fi
          
          # Verify connection string contains test database
          if echo "$DB_CONNECTION_STRING" | grep -q "shriyamining-db-test"; then
            echo "✅ Connection string uses test database (shriyamining-db-test)"
          else
            echo "⚠️  WARNING: Could not verify test database name in connection string"
          fi
          
          # Fail if accidentally using production database
          if echo "$DB_CONNECTION_STRING" | grep -q "shriyamining-db\"" || echo "$DB_CONNECTION_STRING" | grep -q "shriyamining-db;"; then
            if ! echo "$DB_CONNECTION_STRING" | grep -q "shriyamining-db-test"; then
              echo "❌ ERROR: Test SWA using PRODUCTION database!"
              exit 1
            fi
          fi

      - name: Run database migrations (test)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING_TEST }}
        run: |
          echo "🗄️  Running migrations on test database..."
          if npm run migrate; then
            echo "✅ Migrations succeeded"
          else
            echo "❌ Migrations failed"
            exit 1
          fi

      - name: Build frontend
        run: npm run app:build

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_GRASS_078778700 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "public/app"
          api_location: "api"
          skip_app_build: true

      - name: Log deployment info
        if: success()
        run: |
          echo "✅ Test SWA deployment succeeded!"
          echo "Frontend: public/app/dist"
          echo "API: api/"
          echo "Database: shriyamining-db-test"
          echo "Status: Check Azure Portal for details"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_GRASS_078778700 }}
          action: "close"
